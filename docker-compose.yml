services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citations}
      POSTGRES_DB: ${POSTGRES_DB:-citations}
    volumes:
      - db-data:/var/lib/postgresql/data

  back:
    build: ./back
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-citations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citations}
      POSTGRES_DB: ${POSTGRES_DB:-citations}
    depends_on:
      - db
    restart: on-failure

  front:
    build: ./front

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back
      - front

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db-data:
